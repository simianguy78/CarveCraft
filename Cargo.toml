[package]
name = "carvecraft"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/simianguy78/CarveCraft"

[dependencies]
eframe = "0.31"
egui = { version = "0.31", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
clipper2-rust = "1"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
